name: Build Gini Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto-Rebrand Entire App from Echo to Gini
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.gini.music"/g' app/build.gradle.kts
          sed -i 's/Echo Music/Gini Music/g; s/"Echo"/"Gini Music"/g' app/build.gradle.kts
          sed -i 's/Echo Music/Gini Music/g; s/"Echo"/"Gini Music"/g' app/src/main/AndroidManifest.xml
          find app/src/main/res -name "*.xml" -type f -exec sed -i 's/Echo Music/Gini Music/gI; s/Echo Brain/Gini Brain/gI; s/Echo Find/Gini Find/gI; s/Echo Wrapped/Gini Wrapped/gI; s/>Echo</>Gini Music</g; s/Echo/Gini/g' {} +
          find app/src/main -name "*.kt" -type f -exec sed -i 's/"Echo Music"/"Gini Music"/g; s/"Echo Brain"/"Gini Brain"/g; s/"Echo Find"/"Gini Find"/g; s/"Echo"/"Gini"/g' {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Gini Music APK (FOSS Variant)
        run: ./gradlew assembleUniversalFossDebug -x spotlessCheck

      - name: Upload Finished Gini Music APK
        uses: actions/upload-artifact@v4
        with:
          name: Gini-Music-APK
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          
