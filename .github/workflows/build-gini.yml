name: Build Gini Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Safe Rebrand from Echo to Gini
        run: |
          # Safely replace display text inside strings.xml ONLY
          find app/src/main/res -name "strings.xml" -type f -exec sed -i 's/Echo Music/Gini Music/g; s/Echo Brain/Gini Brain/g; s/Echo Find/Gini Find/g; s/Echo Wrapped/Gini Wrapped/g; s/>Echo</>Gini Music</g' {} +

          # Safely update AndroidManifest label if hardcoded
          sed -i 's/android:label="Echo[^"]*"/android:label="Gini Music"/g' app/src/main/AndroidManifest.xml

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Gini Music APK
        run: ./gradlew assembleUniversalGmsDebug -x spotlessCheck -x lint

      - name: Upload Finished Gini Music APK
        uses: actions/upload-artifact@v4
        with:
          name: Gini-Music-APK
          path: app/build/outputs/apk/**/*.apk
          
