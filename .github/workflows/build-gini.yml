name: Build Gini Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Clean Upstream Code
        uses: actions/checkout@v4
        with:
          repository: EchoMusicApp/Echo-Music
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK, NDK 27 & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true
          # Fallback compileSdk from 37 to 36 if preview SDK 37 is not available on runner
          if ! $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep -q "platforms;android-37"; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" || find . -name "build.gradle.kts" -type f -exec sed -i 's/compileSdk = 37/compileSdk = 36/g; s/targetSdk = 37/targetSdk = 36/g' {} +
          fi

      - name: Safely Rebrand Display Name to Gini Music
        run: |
          find app/src/main/res -name "strings.xml" -type f -exec sed -i 's/Echo Music/Gini Music/g; s/Echo Brain/Gini Brain/g; s/Echo Find/Gini Find/g; s/Echo Wrapped/Gini Wrapped/g; s/>Echo</>Gini Music</g' {} +

      - name: Build Gini Music APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug -x spotlessCheck -x lint

      - name: Upload Finished Gini Music APK
        uses: actions/upload-artifact@v4
        with:
          name: Gini-Music-APK
          path: app/build/outputs/apk/**/*.apk
          
