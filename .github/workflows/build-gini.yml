name: Build Gini Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Official Stable Release (v1.4.3)
        uses: actions/checkout@v4
        with:
          repository: EchoMusicApp/Echo-Music
          ref: v1.4.3
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Safely Rebrand Display Name to Gini Music
        run: |
          # Replace display strings inside strings.xml safely without breaking XML syntax
          find app/src/main/res -name "strings.xml" -type f -exec sed -i 's/Echo Music/Gini Music/g; s/Echo Brain/Gini Brain/g; s/Echo Find/Gini Find/g; s/Echo Wrapped/Gini Wrapped/g; s/>Echo</>Gini Music</g' {} +

      - name: Compile Gini Music APK
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6144m -Dfile.encoding=UTF-8"
          # Try GMS Debug first (official default), and automatically fall back to FOSS Debug if needed
          ./gradlew assembleUniversalGmsDebug -x spotlessCheck -x lint --no-daemon > build_log.txt 2>&1 || ./gradlew assembleUniversalFossDebug -x spotlessCheck -x lint --no-daemon >> build_log.txt 2>&1

      - name: Upload Finished Gini Music APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gini-Music-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Print Exact Error If Anything Fails
        if: failure()
        run: |
          echo "=== EXACT BUILD ERROR ==="
          grep -E "(FAILURE:|What went wrong:|^\* |Exception|Error:)" -A 15 build_log.txt | tail -n 60 || tail -n 80 build_log.txt
          
